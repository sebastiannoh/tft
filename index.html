<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TFT 대시보드</title>
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.3/build/stlite.css">
<style>
  html, body { margin: 0; height: 100%; background: #0A1428; color: #EEF2F8; font-family: 'Noto Sans KR', sans-serif; }
  #gate { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 24px; background: #0A1428; }
  #card { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 18px; }
  #card h1 { margin: 0; font-family: 'Barlow Condensed', 'Noto Sans KR', sans-serif; font-size: 40px; line-height: 1.1; font-weight: 700; }
  #card p { margin: 0; font-size: 15px; line-height: 1.7; color: #C9D3E4; word-break: keep-all; }
  #msg { min-height: 24px; font-size: 14px; color: #A9B6CC; }
  #msg.err { color: #FF8D73; }
  #bar { height: 4px; border-radius: 2px; background: #1E2D4F; overflow: hidden; display: none; }
  #bar > div { width: 35%; height: 100%; background: #FF6B4A; border-radius: 2px; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  @media (prefers-reduced-motion: reduce) { #bar > div { animation: none; width: 100%; } }
  #retry { display: none; align-self: flex-start; height: 44px; padding: 0 18px; border: 1px solid #2A3B63; border-radius: 10px; background: transparent;
    color: #EEF2F8; font: inherit; font-size: 14px; cursor: pointer; }
  #retry:hover { border-color: #FF6B4A; }
  .lab { font-size: 13px; font-weight: 500; letter-spacing: .08em; color: #FF6B4A; }
</style>
</head>
<body>
<div id="gate"><div id="card">
  <div class="lab">TFT DASHBOARD</div>
  <h1>로그인이 필요합니다</h1>
  <p>회사 구글 계정으로 로그인해 주세요. 권한 명단에 있는 계정만 볼 수 있습니다.</p>
  <div id="signin"></div>
  <div id="bar"><div></div></div>
  <div id="msg" role="status" aria-live="polite"></div>
  <button id="retry" type="button">다시 시도</button>
</div></div>
<div id="root"></div>

<script src="./site-config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module">
// 이 페이지는 로그인 창과 대시보드를 띄우는 틀뿐이다. 데이터도, 대시보드 프로그램도 여기에는 없다.
// 로그인 결과를 데이터 창구(Apps Script)로 보내면, 창구가 회사 계정·권한 명단을 확인한 뒤에만 프로그램과 데이터를 돌려준다.
const SITE = window.TFT_SITE || {};
const isLocal = ["localhost", "127.0.0.1"].includes(location.hostname);
const dev = isLocal ? new URLSearchParams(location.search).get("dev") : null;      // 이 PC에서 시험할 때만: ?dev=이메일
const PROXY = dev ? "http://127.0.0.1:8766/" : SITE.proxyUrl;
const KEY = "tft_session";
const $ = (id) => document.getElementById(id);
const ERRORS = {
  invalid_token: "로그인 정보를 확인하지 못했습니다. 다시 로그인해 주세요.",
  forbidden_domain: "회사 계정으로만 들어올 수 있습니다. 다른 계정으로 로그인해 주세요.",
  no_permission: "권한 명단에 없는 계정입니다. 관리자에게 권한을 요청해 주세요.",
  sheet_unreadable: "데이터를 읽지 못했습니다. 관리자에게 알려 주세요.",
  not_configured: "아직 설정이 끝나지 않았습니다. 관리자에게 알려 주세요.",
};

function say(text, err) { $("msg").textContent = text || ""; $("msg").className = err ? "err" : ""; }
function busy(on) { $("bar").style.display = on ? "block" : "none"; $("signin").style.display = on ? "none" : "block"; }

async function ask(body) {
  const res = await fetch(PROXY, { method: "POST", body: JSON.stringify(body) });     // 글자 그대로 보내면 사전 요청 없이 간다
  if (!res.ok) throw new Error("http_" + res.status);
  return res.json();
}

async function enter(body) {
  busy(true); $("retry").style.display = "none";
  say("권한을 확인하고 데이터를 받는 중입니다…");
  let p;
  try { p = await ask(body); } catch (e) { p = { error: "network" }; }
  if (p.error) {
    sessionStorage.removeItem(KEY);
    if (body.session) { busy(false); say(""); return showSignIn(); }           // 저장해 둔 세션이 끝났으면 조용히 로그인 창으로
    busy(false);
    say(ERRORS[p.error] || "연결하지 못했습니다. 잠시 뒤 다시 시도해 주세요.", true);
    if (dev) $("retry").style.display = "block";
    return showSignIn();
  }
  sessionStorage.setItem(KEY, p.session);
  say("대시보드를 준비하는 중입니다. 처음에는 30초~1분쯤 걸립니다…");
  await start(p);
}

async function start(p) {
  const files = {};
  for (const [name, text] of Object.entries(p.files || {})) files[name] = { data: text };
  files["config.yaml"] = { data: p.config };
  files["payload.json"] = { data: JSON.stringify({ user: p.user, session: p.session, data: p.data, loaded_at: p.loaded_at }) };
  files["data/preset_settings.json"] = { data: JSON.stringify(p.presets || {}) };
  for (const [date, text] of Object.entries(p.snapshots || {})) files[`data/snapshots/${date}.json`] = { data: text };
  const { mount } = await import("https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.3/build/stlite.js");
  mount({
    requirements: ["pandas", "plotly", "pyyaml"], entrypoint: "app_v2.py", files, env: { TFT_PROXY_URL: PROXY },
    streamlitConfig: { "theme.base": "dark", "theme.primaryColor": "#FF6B4A", "theme.backgroundColor": "#0A1428",
      "theme.secondaryBackgroundColor": "#111E38", "theme.textColor": "#EEF2F8", "client.toolbarMode": "minimal", "browser.gatherUsageStats": false },
  }, $("root"));
  const t0 = Date.now();
  const timer = setInterval(() => {                       // 대시보드 머리줄이 그려지면 로그인 화면을 걷는다
    if (document.querySelector(".st-key-v2_header") || document.querySelector("[data-testid='stException']")) { clearInterval(timer); $("gate").remove(); }
    else if (Date.now() - t0 > 180000) { clearInterval(timer); busy(false); say("준비가 너무 오래 걸립니다. 페이지를 새로고침해 주세요.", true); }
  }, 300);
}

function showSignIn() {
  if (dev) return;
  const ready = () => {
    google.accounts.id.initialize({ client_id: SITE.clientId, callback: (r) => enter({ credential: r.credential }), auto_select: true, ux_mode: "popup" });
    google.accounts.id.renderButton($("signin"), { theme: "filled_blue", size: "large", text: "signin_with", shape: "pill", locale: "ko" });
  };
  if (window.google && google.accounts) ready(); else window.addEventListener("load", () => setTimeout(ready, 0), { once: true });
}

$("retry").addEventListener("click", () => enter({ credential: "dev:" + dev }));
if (!PROXY) { say("아직 설정이 끝나지 않았습니다. 관리자에게 알려 주세요.", true); }
else if (dev) enter({ credential: "dev:" + dev });
else if (sessionStorage.getItem(KEY)) enter({ session: sessionStorage.getItem(KEY) });     // 같은 탭에서 새로고침하면 다시 로그인하지 않는다
else showSignIn();
</script>
</body>
</html>
